# fly.toml app configuration file generated for zug-mcp on 2026-05-21T12:57:37-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zug-mcp'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'
  ZUG_DATA_DIR = '/data/.zug'
  ZUG_CANONICAL = '1'

[[mounts]]
  source = 'zug_data'
  destination = '/data/.zug'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
